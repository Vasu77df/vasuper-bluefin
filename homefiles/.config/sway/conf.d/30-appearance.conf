# 30-appearance.conf — fonts, borders, gaps, focus behavior, wallpaper, bar

font pango:IosevkaTerm Nerd Font SemiBold 11

default_border          pixel 3
default_floating_border pixel 3
gaps inner  8
gaps outer  8
smart_gaps  off
smart_borders off
hide_edge_borders none

workspace_layout         default
focus_follows_mouse      no
focus_on_window_activation smart
focus_wrapping           no
mouse_warping            none

# Window color theme (variables defined in themes/catppuccin-mocha)
# target                  border      title       text    indicator   child border
client.focused            $blue       $blue       $crust  $lavender   $blue
client.focused_inactive   $lavender   $lavender   $crust  $overlay2   $lavender
client.unfocused          $overlay1   $overlay1   $crust  $surface2   $overlay1
client.urgent             $red        $red        $crust  $peach      $red
client.placeholder        $surface2   $surface2   $text   $overlay0   $surface2
client.background         $base

output * bg $HOME/.config/sway/wallpaper.png fill

bar {
    swaybar_command waybar
}
