# 40-keybindings.conf

# ── Session ───────────────────────────────────────────────────────────────────
bindsym $mod+Shift+c   reload
bindsym $mod+Escape    exec $lock
bindsym $mod+Shift+e   exec $scripts/power-menu.sh
bindsym $mod+Shift+p   exec $scripts/power-menu.sh

# ── Applications ─────────────────────────────────────────────────────────────
bindsym $mod+t         exec $term
bindsym $mod+d         exec $menu
bindsym $mod+space     exec $menu
bindsym $mod+Shift+b   exec $browser
bindsym $mod+Ctrl+f    exec $file_manager
bindsym $mod+Shift+q   kill

# ── Focus ─────────────────────────────────────────────────────────────────────
bindsym $mod+h         focus left
bindsym $mod+j         focus down
bindsym $mod+k         focus up
bindsym $mod+l         focus right
bindsym $mod+Left      focus left
bindsym $mod+Down      focus down
bindsym $mod+Up        focus up
bindsym $mod+Right     focus right

# ── Move windows ──────────────────────────────────────────────────────────────
bindsym $mod+Shift+h   move left
bindsym $mod+Shift+j   move down
bindsym $mod+Shift+k   move up
bindsym $mod+Shift+l   move right
bindsym $mod+Shift+Left  move left
bindsym $mod+Shift+Down  move down
bindsym $mod+Shift+Up    move up
bindsym $mod+Shift+Right move right

floating_modifier $mod normal

mode "resize" {
    bindsym h      resize shrink width  20px
    bindsym j      resize grow   height 20px
    bindsym k      resize shrink height 20px
    bindsym l      resize grow   width  20px
    bindsym Left   resize shrink width  20px
    bindsym Down   resize grow   height 20px
    bindsym Up     resize shrink height 20px
    bindsym Right  resize grow   width  20px
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+r mode "resize"

# ── Workspaces ────────────────────────────────────────────────────────────────
bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5
bindsym $mod+6 workspace number $ws6
bindsym $mod+7 workspace number $ws7
bindsym $mod+8 workspace number $ws8
bindsym $mod+9 workspace number $ws9

bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5
bindsym $mod+Shift+6 move container to workspace number $ws6
bindsym $mod+Shift+7 move container to workspace number $ws7
bindsym $mod+Shift+8 move container to workspace number $ws8
bindsym $mod+Shift+9 move container to workspace number $ws9

# ── Layouts and scratchpad ────────────────────────────────────────────────────
bindsym $mod+b         splith
bindsym $mod+v         splitv
bindsym $mod+s         layout stacking
bindsym $mod+w         layout tabbed
bindsym $mod+e         layout toggle split
bindsym $mod+f         fullscreen
bindsym $mod+Shift+f   floating toggle
bindsym $mod+Tab       focus mode_toggle
bindsym $mod+a         focus parent
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus     scratchpad show

# ── Audio and brightness ──────────────────────────────────────────────────────
bindsym --locked XF86AudioRaiseVolume  exec wpctl set-volume -l 1.25 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume  exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute         exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioMicMute      exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym --locked XF86MonBrightnessDown exec brightnessctl --class=backlight set 5%-
bindsym --locked XF86MonBrightnessUp   exec brightnessctl --class=backlight set +5%

# ── Notifications ─────────────────────────────────────────────────────────────
bindsym $mod+n         exec makoctl dismiss
bindsym $mod+Shift+n   exec makoctl restore
bindsym $mod+Ctrl+n    exec $scripts/notification-toggle.sh
bindsym $mod+Alt+n     exec $scripts/notification-action.sh

# ── Screenshots ───────────────────────────────────────────────────────────────
bindsym Print          exec $scripts/screenshot.sh full
bindsym Shift+Print    exec $scripts/screenshot.sh area
bindsym Ctrl+Print     exec $scripts/screenshot.sh window
bindsym $mod+y         exec $scripts/screenshot.sh full
bindsym $mod+Shift+y   exec $scripts/screenshot.sh area

# ── Window metadata ───────────────────────────────────────────────────────────
bindsym $mod+Shift+i   exec $scripts/focused-window.sh --notify
