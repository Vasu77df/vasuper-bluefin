# 50-window-rules.conf — floating rules, inhibit idle, window sizing

# ── Generic transient / dialog windows ───────────────────────────────────────
for_window [window_type="dialog"]  floating enable, move position center
for_window [window_type="utility"] floating enable, move position center
for_window [window_type="splash"]  floating enable, move position center
for_window [window_role="(?i)^(pop-up|task_dialog|GtkFileChooserDialog)$"] \
    floating enable, move position center
no_focus [window_type="notification"]

# ── System settings and compact utilities ────────────────────────────────────
for_window [app_id="(?i)^(pavucontrol|nm-connection-editor|blueman-manager|network\.cycles\.wdisplays|solaar|org\.gnome\.(Calculator|DiskUtility|FileRoller|Settings|SystemMonitor|font-viewer|seahorse\.Application))$"] \
    floating enable, resize set 72ppt 76ppt, move position center
for_window [class="(?i)^(Pavucontrol|Nm-connection-editor|Blueman-manager|Wdisplays|Solaar|Gnome-control-center|Gnome-system-monitor)$"] \
    floating enable, resize set 72ppt 76ppt, move position center

# ── Setup, device, and security utilities ────────────────────────────────────
for_window [app_id="(?i)^(jetbrains-toolbox|balena-etcher|intune-portal|acme|vpnui)$"] \
    floating enable, resize set 68ppt 72ppt, move position center
for_window [class="(?i)^(jetbrains-toolbox|balenaEtcher|Intune Portal|Acme|vpnui)$"] \
    floating enable, resize set 68ppt 72ppt, move position center
for_window [class="(?i)^virt-manager$" title="(?i)^Virtual Machine Manager$"] \
    floating enable, resize set 70ppt 76ppt, move position center

# ── Authentication and file-operation prompts ─────────────────────────────────
for_window [title="(?i).*(Authentication Required|Authenticate|Password Required|Enter Password|Unlock Keyring).*"] \
    floating enable, move position center
for_window [title="(?i)^(Open File|Open Folder|Save File|Save As|Select a File|Select Folder|Choose Files?).*"] \
    floating enable, resize set 70ppt 72ppt, move position center

# ── Browser and media picture-in-picture ─────────────────────────────────────
for_window [title="(?i)^(Picture-in-Picture|Picture in picture)$"] \
    floating enable, sticky enable, border pixel 2

# ── Zoom: float launchers, tile meeting surfaces ──────────────────────────────
for_window [class="(?i)^zoom$"   title="(?i)^(Zoom|Zoom Workplace|Zoom Cloud Meetings)$"] \
    floating enable, resize set 62ppt 72ppt, move position center
for_window [app_id="(?i)^zoom$"  title="(?i)^(Zoom|Zoom Workplace|Zoom Cloud Meetings)$"] \
    floating enable, resize set 62ppt 72ppt, move position center
for_window [class="(?i)^zoom$"   title="(?i).*(Participants|Chat|Interpretation|Meeting Controls|Settings|Statistics).*"] \
    floating enable, move position center
for_window [app_id="(?i)^zoom$"  title="(?i).*(Participants|Chat|Interpretation|Meeting Controls|Settings|Statistics).*"] \
    floating enable, move position center
for_window [class="(?i)^zoom$"   window_role="(?i)^(pop-up|task_dialog)$"] \
    floating enable, move position center
for_window [class="(?i)^zoom$"   title="(?i).*Zoom Meeting.*"] \
    floating disable, inhibit_idle fullscreen
for_window [app_id="(?i)^zoom$"  title="(?i).*Zoom Meeting.*"] \
    floating disable, inhibit_idle fullscreen

# ── Communication pop-outs ────────────────────────────────────────────────────
for_window [app_id="(?i)^slack$" title="(?i).*(Huddle|Call).*"] \
    floating enable, resize set 55ppt 65ppt, move position center
for_window [class="(?i)^slack$"  title="(?i).*(Huddle|Call).*"] \
    floating enable, resize set 55ppt 65ppt, move position center

# ── Fullscreen browser / media / remote-session views may inhibit idle ────────
for_window [app_id="(?i)^(firefox|google-chrome|microsoft-edge|vlc|org\.gnome\.Totem|org\.remmina\.Remmina|com\.amazon\.workspacesclient.*)$"] \
    inhibit_idle fullscreen
for_window [class="(?i)^(firefox|Google-chrome|Microsoft-edge|vlc|Totem|org\.remmina\.Remmina|workspacesclient)$"] \
    inhibit_idle fullscreen
