# 20-outputs.conf — default output config and workspace→output affinity
# Kanshi handles multi-monitor profiles; this is a safe fallback.

output eDP-1 mode 1920x1200@60.001Hz position 0,0 scale 1.0

# Workspace→output preference order (left → center → laptop)
workspace $ws1 output DP-3 DP-5 DP-6 eDP-1
workspace $ws2 output DP-1 eDP-1
workspace $ws3 output eDP-1
workspace $ws4 output DP-3 DP-5 DP-6 eDP-1
workspace $ws5 output DP-1 eDP-1
workspace $ws6 output eDP-1
workspace $ws7 output DP-3 DP-5 DP-6 eDP-1
workspace $ws8 output DP-1 eDP-1
workspace $ws9 output eDP-1
