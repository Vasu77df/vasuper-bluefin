# /etc/sway/config-vars.d/10-session.conf
# System-level Sway variable drop-in shipped with the vasuper-bluefin image.
# This file is sourced by every user's Sway config via:
#   include /etc/sway/config-vars.d/*
#
# Variables here define image-wide defaults. Users may override them in
# ~/.config/sway/conf.d/ or their own config.

# Import the running Wayland/D-Bus environment into systemd user scope so that
# xdg-desktop-portal and other user services can find the session socket.
exec systemctl --user import-environment DISPLAY WAYLAND_DISPLAY SWAYSOCK \
    XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE
exec dbus-update-activation-environment --systemd \
    DISPLAY WAYLAND_DISPLAY SWAYSOCK \
    XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE
